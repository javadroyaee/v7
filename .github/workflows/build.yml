name: Build and Release Signed APK
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Download Xray and Tun2Socks
        run: |
          mkdir -p app/libs app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          curl -fL -o app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar"
          curl -fL -o t2s64.zip "https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-android-arm64.zip"
          unzip -o t2s64.zip -d t2s64 && mv t2s64/tun2socks* app/src/main/jniLibs/arm64-v8a/libtun2socks.so
          curl -fL -o t2s32.zip "https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-android-armv7.zip"
          unzip -o t2s32.zip -d t2s32 && mv t2s32/tun2socks* app/src/main/jniLibs/armeabi-v7a/libtun2socks.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libtun2socks.so app/src/main/jniLibs/armeabi-v7a/libtun2socks.so
      - name: Generate Keystore
        run: keytool -genkey -v -keystore app/release.keystore -alias avangkey -keyalg RSA -keysize 2048 -validity 10000 -storepass avangvpnpass -keypass avangvpnpass -dname "CN=AvangVPN"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace || gradle assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Avang-VPN-Release.apk || cp app/build/outputs/apk/release/app-release.apk Avang-VPN-Release.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Avang-VPN-Release-APK
          path: Avang-VPN-Release.apk
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Avang-VPN-Release.apk
          name: Avang VPN ${{ github.ref_name }}
